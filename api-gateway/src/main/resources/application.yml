server:
  port: 8080
spring:
  application:
    name: api-gateway
  config:
    import: "configserver:http://localhost:8888"
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[http://localhost:4200]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: vehicule-service
          uri: lb://vehicule-service
          predicates:
            - Path=/api/vehicules/**
          filters:
            - StripPrefix=1
        - id: client-service
          uri: lb://client-service
          predicates:
            - Path=/api/clients/**
          filters:
            - StripPrefix=1
        - id: location-service
          uri: lb://location-service
          predicates:
            - Path=/api/locations/**
          filters:
            - StripPrefix=1
  zipkin:
    base-url: http://localhost:9411/
    sender:
      type: web
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    org.springframework.cloud.sleuth: INFO
spring:
  sleuth:
    sampler:
      probability: 1.0
