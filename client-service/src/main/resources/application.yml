server:
  port: 8082
spring:
  application:
    name: client-service
  config:
    import: "configserver:http://localhost:8888"
  zipkin:
    base-url: http://localhost:9411/
    sender:
      type: web
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    org.springframework.cloud.sleuth: INFO
