server:
  port: 8083

spring:
  application:
    name: location-service
  config:
    import: "optional:configserver:http://localhost:8888"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

driveeasy:
  location:
    late-penalty-multiplier: 1.5
    discounts:
      fidele: 0.05
      vip: 0.10
    categories-coefficients:
      ECONOMIQUE: 1.0
      BERLINE: 1.2
      SUV: 1.3
      LUXE: 1.5
      UTILITAIRE: 1.1
