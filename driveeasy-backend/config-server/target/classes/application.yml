server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native,git
  cloud:
    config:
      server:
        native:
          search-locations:
            - file://${user.home}/Desktop/DriveEasy/driveeasy-config
            - classpath:/config
        git:
          uri: file://${user.home}/Desktop/DriveEasy/driveeasy-config
          default-label: master
          clone-on-start: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
