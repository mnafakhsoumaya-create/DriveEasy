version: '3.8'

services:
  # Service de Traçage Distribué et Observabilité
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: driveeasy-zipkin
    restart: always
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - driveeasy-network

networks:
  driveeasy-network:
    driver: bridge
